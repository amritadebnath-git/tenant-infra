name: Docker Compose CI

on:
  push:
    branches: [ infra-framwork ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: sqlite
        ports:
          - 5432:5432  # Optional for visibility

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Flask unit tests
      run: |
        python app/Test_app.py
